name: 京东假货舆情周报（每周三自动生成）

on:
  schedule:
    # 每周三 09:00 北京时间（UTC+8），即 UTC 01:00
    - cron: '0 1 * * 3'
  workflow_dispatch:
    # 支持手动触发，方便补跑或测试

jobs:
  generate-report:
    name: 生成假货舆情周报
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 允许 push 报告文件回仓库

    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install anthropic

      - name: 生成本周报告
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_report.py

      - name: 提交并推送报告
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          # 如果没有新文件则跳过 commit
          git diff --cached --quiet && echo "无新报告，跳过提交" && exit 0
          WEEK=$(python -c "import datetime; print(datetime.date.today().isocalendar()[1])")
          DATE=$(date '+%Y-%m-%d')
          git commit -m "自动生成：京东假货舆情周报 第${WEEK}期（${DATE}）"
          git push origin HEAD
